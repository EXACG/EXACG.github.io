<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>梦羽的AI绘图测试版前端</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.5/css/bootstrap.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
        }
        
        .main-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }
        
        /* 左侧iframe区域 */
        .left-panel {
            flex: 1;
            height: 100%;
            border-right: 2px solid #ddd;
            background: #f5f5f5;
        }
        
        .left-panel iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* 右侧生成区域 - 基于图片比例1024:1536计算宽度 */
        .right-panel {
            width: calc(100vh * 1024 / 1536);
            min-width: 280px;
            max-width: 450px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #fff;
            overflow-y: auto;
        }
        
        .input-section {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .input-section textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            min-height: 60px;
            max-height: 150px;
            resize: none;
            overflow-y: auto;
        }
        
        .input-section .btn-generate {
            width: 80px;
            height: 36px;
            background: #5577ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            float: right;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        
        .input-section .btn-generate:hover {
            background: #4060ee;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .input-header span {
            color: #999;
            font-size: 13px;
        }
        
        /* 图片展示区域 */
        .result-section {
            flex: 1;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fafafa;
        }
        
        .result-section img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .result-section .placeholder {
            color: #ccc;
            font-size: 48px;
        }
        
        .result-section .alert {
            text-align: center;
            width: 100%;
        }
        
        /* 高级选项区域 */
        .advanced-section {
            border-top: 1px solid #eee;
        }
        
        .advanced-header {
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #333;
        }
        
        .advanced-header:hover {
            background: #f5f5f5;
        }
        
        .advanced-content {
            padding: 0 15px 15px;
            display: none;
        }
        
        .advanced-content.show {
            display: block;
        }
        
        .info-panel {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }
        
        .info-panel h4 {
            color: #5577ff;
            font-size: 13px;
            margin-bottom: 8px;
        }
        
        .info-panel p {
            margin-bottom: 5px;
        }
        
        .model-links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        
        .model-links a {
            display: inline-block;
            background-color: #5577ff;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 11px;
            transition: all 0.3s ease;
        }
        
        .model-links a:hover {
            background-color: #4060ee;
            transform: translateY(-1px);
        }
        
        .arrow {
            transition: transform 0.3s;
        }
        
        .arrow.open {
            transform: rotate(90deg);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 左侧iframe -->
        <div class="left-panel">
            <iframe src="https://magic-tag.netlify.app/" allowfullscreen></iframe>
        </div>
        
        <!-- 右侧生成区 -->
        <div class="right-panel">
            <!-- 输入区域 -->
            <div class="input-section">
                <div class="input-header">
                    <span>请在下方输入你想要的关键TAG(不支持中文)<p>也可从左侧配置完成后一键复制TAG到这里粘贴</p></span>
                    <button class="btn-generate" onclick="submitdata()">生成</button>
                </div>
                <textarea id="keywordInput" placeholder="在此输入关键词..."></textarea>
            </div>
            
            <!-- 图片展示区域 -->
            <div class="result-section" id="resultArea">
                <span class="placeholder">🖼</span>
            </div>
            
            <!-- 高级选项 -->
            <div class="advanced-section">
                <div class="advanced-header" onclick="toggleAdvanced()">
                    <span>更多说明</span>
                    <span class="arrow" id="advancedArrow">▶</span>
                </div>
                <div class="advanced-content" id="advancedContent">
                    <div class="info-panel">
                        <p>使用时避免使用{{}}等特殊符号改为()符号进行提权</p>
                        <p>公开使用,限制每个月10万次H200的画图请求额度!</p>
                        <p>QQ:1031029814 QQ频道:<a href="https://qun.qq.com/qqweb/qunpro/share?_wv=3&_wwv=128&inviteCode=1cg5Q4&from=246610&biz=ka">精神养老院</a></p>
                        <h4><div class="model-links"><a href="https://sd.exacg.cc" target="_blank">[推荐]不限量的画图站 梦羽的AI画图</a></div></h4>
                        <hr style="margin:8px 0"/>
                        <p>更多免费H200画图服务看↓↓↓ 限制：同IP地址一个小时内生成30张图</p>
                        <div class="model-links">
                            <a href="https://huggingface.co/spaces/Menyu/MiaoHarem" target="_blank">喵喵1.6</a>
                            <a href="https://huggingface.co/spaces/Menyu/MiaoPixelNew" target="_blank">喵喵像素</a>
                            <a href="https://huggingface.co/spaces/Menyu/NoobVPre06" target="_blank">NoobV预测0.6</a>
                            <a href="https://huggingface.co/spaces/Menyu/NoobVPre065s" target="_blank">NoobV预测0.65s</a>
                            <a href="https://huggingface.co/spaces/Menyu/NoobXL11" target="_blank">NoobXL正式版1.1</a>
                            <a href="https://huggingface.co/spaces/Menyu/illustrious_pencil-XL" target="_blank">illustrious融合</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
    <script>
    function toggleAdvanced() {
        var content = document.getElementById('advancedContent');
        var arrow = document.getElementById('advancedArrow');
        content.classList.toggle('show');
        arrow.classList.toggle('open');
    }
    toggleAdvanced();
    // 文本框自适应高度
    document.addEventListener('DOMContentLoaded', function() {
        const textarea = document.getElementById('keywordInput');
        function autoResize() {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
        }
        textarea.addEventListener('input', autoResize);
    });
    
    function submitdata() {
        $("#resultArea").html('<div class="alert alert-warning"><strong>生成中，请稍候...</strong></div>');
        
        $.ajax({
            url: 'https://mmh.vwo50.workers.dev/gradio_api/call/infer',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                data: [
                    $("#keywordInput").val(),
                    "lowres, {bad}, error, fewer, extra, missing, worst quality, jpeg artifacts, bad quality, watermark, unfinished, displeasing, chromatic aberration, signature, extra digits, artistic error, username, scan, [abstract]",
                    true,
                    0,
                    1024,
                    1536,
                    7,
                    28,
                    true
                ]
            }),
            success: function(response) {
                var eventId = response.event_id;
                var eventSource = new EventSource('https://menyu-miaomiaoharem17.hf.space/gradio_api/call/infer/' + eventId);
                
                eventSource.onmessage = function(event) {
                    if (event.data.includes("url") && event.data.includes("image.png")) {
                        try {
                            var jsonStr = event.data;
                            if (jsonStr.includes("data:")) {
                                jsonStr = jsonStr.split("data:")[1].trim();
                            }
                            var jsonData = JSON.parse(jsonStr);
                            if (Array.isArray(jsonData) && jsonData.length > 0 && jsonData[0].url) {
                                var imageUrl = jsonData[0].url;
                                $("#resultArea").html('<img src="' + imageUrl + '" alt="生成的图像"/>');
                                eventSource.close();
                                clearTimeout(timeout);
                            }
                        } catch (e) {
                            console.error("解析JSON数据出错:", e);
                        }
                    }
                };
                
                eventSource.addEventListener('complete', function(event) {
                    try {
                        var jsonStr = event.data;
                        if (jsonStr.includes("data:")) {
                            jsonStr = jsonStr.split("data:")[1].trim();
                        }
                        var jsonData = JSON.parse(jsonStr);
                        if (Array.isArray(jsonData) && jsonData.length > 0 && jsonData[0].url) {
                            var imageUrl = jsonData[0].url;
                            $("#resultArea").html('<img src="' + imageUrl + '" alt="生成的图像"/>');
                            eventSource.close();
                            clearTimeout(timeout);
                        }
                    } catch (e) {
                        console.error("解析complete事件数据出错:", e);
                    }
                });
                
                eventSource.onerror = function(error) {
                    eventSource.close();
                    clearTimeout(timeout);
                    $("#resultArea").html('<div class="alert alert-danger"><strong>连接出错，请重试</strong></div>');
                };
                
                var timeout = setTimeout(function() {
                    if (eventSource.readyState !== EventSource.CLOSED) {
                        eventSource.close();
                        $("#resultArea").html('<div class="alert alert-warning"><strong>请求超时，请重试</strong></div>');
                    }
                }, 60000);
            },
            error: function() {
                $("#resultArea").html('<div class="alert alert-danger"><strong>请求失败，请重试</strong></div>');
            }
        });
    }
    </script>
</body>
</html>
